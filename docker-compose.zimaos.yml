# Pronto a colar em ZimaOS: App Store -> Install a customized app -> Import ->
# Docker Compose.
#
# Escrito no dialeto do ZimaOS/CasaOS, não em compose genérico: serviço chamado
# `main_app`, bloco `x-casaos`, memória em bytes e `cpu_shares` em vez de `cpus`.
# Assim a importação não mastiga os campos.
#
# Não precisa de ficheiros na máquina: nem repositório clonado, nem .env, nem
# mcp.json. Tudo entra por variáveis de ambiente, editáveis depois no painel.
#
# ANTES DE COLAR, substitui todos os valores COLOCAR_*. Confirma também:
#   - a rede: tem de ser aquela onde vive o teu n8n (`docker network ls`)
#   - /dev/dri: só se a máquina tiver GPU integrada
name: claude-runner-swonkie

services:
  main_app:
    image: ghcr.io/swonkie-dev/claude-runner:latest
    container_name: claude-runner-swonkie
    restart: unless-stopped
    cpu_shares: 50

    # O Chromium rebenta com "Target closed" se /dev/shm ficar nos 64MB por
    # omissão do Docker. Confirma depois da importação (ver README): se o painel
    # tiver descartado este campo, tens de o repor.
    shm_size: 1073741824

    deploy:
      resources:
        limits:
          # 10 GiB em bytes. O ZimaOS exporta este campo como inteiro sem aspas,
          # mas o `docker compose config` exige string, por isso vai entre aspas:
          # é aceite pelos dois. Se a importação se queixar, tira as aspas.
          memory: "10737418240"

    # Aceleração por hardware (VAAPI). Não é preciso group_add: o renderD128
    # costuma ficar com permissões crw-rw-rw-, acessível a qualquer utilizador.
    # Confirma com `ls -l /dev/dri` antes de assumir.
    devices:
      - /dev/dri:/dev/dri

    # Só para poderes testar com curl a partir do host. O n8n NÃO precisa disto:
    # fala com o container pelo nome, dentro da rede. Se publicares, a API fica
    # exposta na LAN e a única proteção é o RUNNER_TOKEN.
    ports:
      - target: 8080
        published: "8099"
        protocol: tcp

    environment:
      # --- autenticação ---
      CLAUDE_CODE_OAUTH_TOKEN: COLOCAR_TOKEN_SUBSCRICAO
      RUNNER_TOKEN: COLOCAR_OPENSSL_RAND_HEX_32

      # --- fila ---
      INSTANCE: swonkie
      MAX_CONCURRENCY: "2"
      DEFAULT_MAX_BUDGET_USD: "0"
      DEFAULT_TIMEOUT_MS: "3600000"
      RESCHEDULE_ON_RATE_LIMIT: "true"
      MAX_RESCHEDULES: "3"
      FAIL_ON_MCP_ERROR: "true"

      # --- MCPs ---
      # O JSON completo numa variável. O entrypoint escreve-o no arranque e
      # valida-o; se não for JSON válido, o container não sobe.
      #
      # ATENÇÃO ao $$: é escape do Compose, que produz um $ literal. Sem ele as
      # variáveis eram substituídas por vazio ANTES do arranque, todos os MCPs
      # falhavam e todos os jobs abortavam. Verificado em container.
      MCP_CONFIG_JSON: >-
        {"mcpServers":{
        "playwright":{"command":"playwright-mcp","args":["--headless","--isolated"]},
        "swonkie":{"type":"http","url":"$${SWONKIE_MCP_URL}"},
        "teams":{"type":"http","url":"$${TEAMS_MCP_URL}","headers":{"Authorization":"$${TEAMS_AUTHORIZATION}","CF-Access-Client-Id":"$${CF_ACCESS_CLIENT_ID}","CF-Access-Client-Secret":"$${CF_ACCESS_CLIENT_SECRET}"}},
        "hievents":{"type":"http","url":"$${HIEVENTS_MCP_URL}","headers":{"Authorization":"$${HIEVENTS_AUTHORIZATION}","CF-Access-Client-Id":"$${CF_ACCESS_CLIENT_ID}","CF-Access-Client-Secret":"$${CF_ACCESS_CLIENT_SECRET}"}},
        "posthog":{"type":"http","url":"https://mcp.posthog.com/mcp","headers":{"Authorization":"Bearer $${POSTHOG_API_KEY}"}}
        }}

      SWONKIE_MCP_URL: COLOCAR_URL_MCP_SWONKIE
      TEAMS_MCP_URL: COLOCAR_URL_MCP_TEAMS
      TEAMS_AUTHORIZATION: COLOCAR_AUTHORIZATION_TEAMS
      HIEVENTS_MCP_URL: COLOCAR_URL_MCP_HIEVENTS
      HIEVENTS_AUTHORIZATION: COLOCAR_AUTHORIZATION_HIEVENTS
      CF_ACCESS_CLIENT_ID: COLOCAR_CF_ACCESS_CLIENT_ID
      CF_ACCESS_CLIENT_SECRET: COLOCAR_CF_ACCESS_CLIENT_SECRET
      POSTHOG_API_KEY: COLOCAR_CHAVE_PESSOAL_POSTHOG

      # --- git ---
      GH_TOKEN: COLOCAR_PAT_FINE_GRAINED
      GIT_AUTHOR_NAME: Claude Runner (Swonkie)
      GIT_AUTHOR_EMAIL: dev@swonkie.com
      GIT_COMMITTER_NAME: Claude Runner (Swonkie)
      GIT_COMMITTER_EMAIL: dev@swonkie.com

    # Volumes com nome, de propósito, e não bind mounts para /DATA/AppData: o
    # container corre como o utilizador `node` (uid 1000), e uma pasta criada
    # pelo Docker num bind mount fica com dono root, o que dá permission denied
    # a escrever. Um volume com nome herda as permissões da imagem.
    volumes:
      - claude-home:/home/node/.claude
      - claude-work:/work
      - claude-cache:/home/node/.cache

    networks:
      - n8n

    cap_add: []
    privileged: false

    labels:
      icon: https://icon.casaos.io/main/all/docker.png

volumes:
  claude-home:
  claude-work:
  claude-cache:

networks:
  n8n:
    name: n8n

x-casaos:
  author: self
  category: self
  hostname: ""
  icon: https://icon.casaos.io/main/all/docker.png
  index: /
  is_uncontrolled: false
  port_map: "8099"
  scheme: http
  store_app_id: claude-runner-swonkie
  title:
    custom: Claude Runner (Swonkie)
