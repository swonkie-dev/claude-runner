name: build-image

# Publica a imagem no GHCR. O repositório é público, portanto os minutos de
# Actions são gratuitos. O pacote em si tem de ser tornado público UMA VEZ, à
# mão, nas definições do package: por omissão nasce privado mesmo em repos
# públicos, e o ZimaOS não consegue puxar imagens privadas.
#
# Deliberadamente SEM actions de terceiros: só `actions/checkout`, que é da
# própria GitHub. Organizações com a política de Actions restrita a "enterprise
# and select actions" bloqueiam `docker/build-push-action` e companhia, e a
# falha aparece logo no passo "Set up job", antes de qualquer output útil.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # A imagem passa dos 5GB e o runner vem com pouco espaço livre. Sem isto o
      # build morre com "no space left on device" já perto do fim.
      - name: Libertar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          docker image prune -af || true
          df -h /

      - name: Build e push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHA="${GITHUB_SHA::7}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build -t "$IMAGE:latest" -t "$IMAGE:$SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA"
          echo "publicado: $IMAGE:latest e $IMAGE:$SHA"
